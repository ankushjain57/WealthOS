# WealthOS CI/CD Pipeline
# GitHub Actions workflow for production deployment

name: WealthOS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ========================
  # STAGE 1: TEST
  # ========================
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Unit & Integration Tests
        run: node tests/test_suite.js

      - name: Validate HTML Structure
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('WealthOS.html', 'utf8');
          const checks = [
            ['Dashboard section', html.includes('page-dashboard')],
            ['Portfolio section', html.includes('page-portfolio')],
            ['Risk section', html.includes('page-risk')],
            ['Stress test section', html.includes('page-stress')],
            ['AI Advisor section', html.includes('page-advisor')],
            ['Trade section', html.includes('page-trades')],
            ['Chart.js loaded', html.includes('chart.umd.min.js')],
            ['XLSX parser loaded', html.includes('xlsx.full.min.js')],
            ['Portfolio data present', html.includes('PORTFOLIO')],
            ['Claude API call', html.includes('api.anthropic.com')],
            ['STT holding present', html.includes('State Street')],
            ['JEPQ holding present', html.includes('JEPQ')],
          ];
          let allPassed = true;
          checks.forEach(([name, result]) => {
            if (result) console.log('✅ ' + name);
            else { console.error('❌ ' + name); allPassed = false; }
          });
          if (!allPassed) process.exit(1);
          console.log('\\n✅ HTML validation passed');
          "

      - name: Check File Size
        run: |
          SIZE=$(wc -c < WealthOS.html)
          echo "File size: ${SIZE} bytes"
          if [ $SIZE -gt 2000000 ]; then echo "❌ File too large"; exit 1; fi
          echo "✅ File size acceptable"

  # ========================
  # STAGE 2: BUILD & OPTIMIZE
  # ========================
  build:
    name: Build Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build tools
        run: npm install -g html-minifier-terser

      - name: Minify HTML/JS
        run: |
          html-minifier-terser WealthOS.html \
            --collapse-whitespace \
            --remove-comments \
            --minify-js true \
            --minify-css true \
            -o dist/WealthOS.min.html
          echo "✅ Minified successfully"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wealthos-production
          path: dist/WealthOS.min.html
          retention-days: 30

  # ========================
  # STAGE 3: DEPLOY (GitHub Pages)
  # ========================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: wealthos-production

      - name: Rename to index.html
        run: mv WealthOS.min.html index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ========================
  # STAGE 4: SMOKE TEST (Post-deploy)
  # ========================
  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Smoke test deployed URL
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then echo "❌ Smoke test failed"; exit 1; fi
          echo "✅ Deployment live and responding"

      - name: Notify success
        run: echo "🚀 WealthOS deployed successfully to production!"
